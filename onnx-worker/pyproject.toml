[project]
name = "its-in-your-head-onnx"
version = "1.0.0"
description = "Isolated ONNX inference worker for the its-in-your-head Tier-1 backend (CPU only)."
requires-python = ">=3.11,<3.15"
dependencies = [
    "onnxruntime>=1.31.1,<1.32",
    "tokenizers>=0.21,<1",
    "numpy>=1.26,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["worker"]
