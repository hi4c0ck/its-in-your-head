[pytest]
; The repo root is a native plugin package (__init__.py = register(ctx)),
; so pytest must not walk it as a Python package. importlib mode + explicit
; pythonpath keeps test collection path-based.
addopts = --import-mode=importlib --basetemp=.pytest-basetemp
pythonpath = .
testpaths = tests
; Disk-hygiene gates (2026-11-06, 39 GB Temp incident):
; - basetemp is repo-local (gitignored) so the suite never dumps into shared
;   %TEMP%, which Windows never prunes.
; - prune passing session temp dirs at session end (pytest 9.x key pair;
;   pre-9 used the single tmp_path_retention option), keep the last 3
;   failed sessions for forensics. tools/temp_budget_check.py is the hard
;   gate (CI + local): suite temp growth > 100 MB fails the run.
tmp_path_retention_policy = failed
tmp_path_retention_count = 3
