name: its-in-your-head
version: 0.1.9
manifest_version: 2
description: "It's in Your Head — observes how you work (tools, turns, friction) with local-only telemetry, a six-dimension perception engine, deterministic adaptation (opt-in), and a 96px desktop signal strip. Zero-network default (Tier-0 sketch embeddings); optional local ONNX Tier-1 behind the same interface. Raw prompts and reasoning are never stored — transient buffer, derived features only."
provides_hooks:
  - pre_llm_call
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - on_stream_delta
  - on_stream_end
  - on_session_start
  - on_session_end
tags: [analytics, observability, desktop]
